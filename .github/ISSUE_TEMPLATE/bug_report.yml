name: Bug report
description: Report a reproducible bug or false positive
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real credentials. Use fake values and redact logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command or endpoint, and the observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: A fake hash, fake secret pattern, or small input is enough.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker version if relevant.
    validations:
      required: false
